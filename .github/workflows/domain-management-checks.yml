name: Oni247 domain management checks

on:
  push:
    branches:
      - feat/oni247-domain-management
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production bundle
        run: npm run build
