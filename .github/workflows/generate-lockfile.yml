name: Generate npm lockfile

on:
  push:
    branches: [security/nextjs-hardening]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

concurrency:
  group: oni247-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin HEAD:${{ github.ref_name }}
