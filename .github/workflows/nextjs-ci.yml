name: Oni247 Next.js CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, audit, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit Next.js migration
        run: npm run audit:nextjs
      - name: Audit project structure
        run: npm run audit:project
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
