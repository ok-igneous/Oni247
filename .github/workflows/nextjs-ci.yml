name: Oni247 Next.js CI

on:
  pull_request:
    branches: [main, nextjs-no-vite]
  push:
    branches: [main, nextjs-no-vite, fix/oni247-security-nextjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oni247-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit project structure
        run: npm run audit:project
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
