name: Oni247 Next.js CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/oni247-security-hardening-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oni247-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
