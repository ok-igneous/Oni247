name: Oni247 standalone source audit

on:
  push:
    branches:
      - standalone-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out standalone branch
        uses: actions/checkout@v4
        with:
          ref: standalone-migration
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit source for legacy platform references and duplicate routes
        run: node scripts/audit-standalone.mjs
